[project]
name = "trinetra"
version = "0.1.0"
description = "Offline-first crypto tracing prototype for cyber cell investigation workflows"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
